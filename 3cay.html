<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102a24">
    <title>Trò chơi bài 3 cây</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #102a24;
            color: #f5f1e8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background:
                radial-gradient(ellipse at 50% 0, rgba(47, 112, 82, 0.42), transparent 55%),
                #102a24;
        }

        .game {
            width: min(100%, 980px);
            margin: 0 auto;
        }

        .game-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #d7b875;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.2rem, 6vw, 3.5rem);
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .subtitle {
            margin: 10px 0 0;
            color: #b7c8bd;
            font-size: 0.95rem;
        }

        .table {
            overflow: hidden;
            padding: clamp(18px, 4vw, 38px);
            border: 1px solid rgba(226, 205, 157, 0.22);
            border-radius: 24px;
            background: linear-gradient(145deg, #1a4938, #14382e 65%, #103027);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32), inset 0 1px rgba(255, 255, 255, 0.06);
        }

        .players {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .player-panel {
            min-width: 0;
            padding: 22px;
            border: 1px solid rgba(230, 219, 188, 0.15);
            border-radius: 18px;
            background: rgba(8, 29, 23, 0.38);
        }

        .player-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .player-number {
            display: grid;
            width: 38px;
            height: 38px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid rgba(215, 184, 117, 0.5);
            border-radius: 50%;
            color: #e6cb8f;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .player-name {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
        }

        .hand {
            display: flex;
            min-height: 145px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 8px;
            border-radius: 12px;
            background: rgba(3, 18, 14, 0.23);
        }

        .playing-card {
            position: relative;
            display: block;
            width: clamp(58px, 9vw, 100px);
            flex: 0 1 auto;
            padding: 0;
            border: 0;
            border-radius: 7px;
            background: transparent;
            cursor: pointer;
            transition: transform 160ms ease;
        }

        .playing-card img {
            display: block;
            width: 100% !important;
            height: auto;
            border-radius: 7px;
            box-shadow: 0 7px 16px rgba(0, 0, 0, 0.3);
        }

        .playing-card:hover {
            transform: translateY(-5px);
        }

        .playing-card:focus-visible {
            outline: 3px solid #e6cb8f;
            outline-offset: 4px;
        }

        .card-value {
            position: absolute;
            right: 4px;
            bottom: 8px;
            left: 4px;
            padding: 5px 2px;
            border-radius: 6px;
            background: rgba(8, 29, 23, 0.88);
            color: #f5e4b7;
            font-size: clamp(0.65rem, 2vw, 0.8rem);
            font-weight: 700;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(4px);
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .playing-card.is-revealed .card-value {
            opacity: 1;
            transform: translateY(0);
        }

        #card-desk {
            height: 1px;
            margin: 26px 0;
            background: linear-gradient(90deg, transparent, rgba(215, 184, 117, 0.42), transparent);
        }

        #result {
            width: min(100%, 420px);
            margin: 24px auto 0;
            padding: 18px 22px;
            border: 1px solid rgba(215, 184, 117, 0.34);
            border-radius: 14px;
            background: rgba(8, 29, 23, 0.52);
            color: #e8dfc7;
            font-size: 0.95rem;
            line-height: 1.8;
            text-align: center;
            text-transform: capitalize;
        }

        @media (max-width: 640px) {
            body {
                padding: 32px 14px;
            }

            .players {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .player-panel {
                padding: 18px 14px;
            }

            .hand {
                min-height: 120px;
                gap: 8px;
            }

            .playing-card {
                width: clamp(62px, 19vw, 100px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <script src="Card.js"></script>
    <script src="player.js"></script>
</head>
<body>
    <main class="game">
        <header class="game-header">
            <p class="eyebrow">Game bài dân gian</p>
            <h1>3 Cây</h1>
            <p class="subtitle">Mỗi người 3 lá — cùng xem ai có điểm cao hơn</p>
        </header>

        <section class="table" aria-label="Bàn chơi bài 3 cây">
            <div class="players">
                <section class="player-panel" aria-labelledby="player1-name">
                    <div class="player-heading">
                        <span class="player-number" aria-hidden="true">01</span>
                        <h2 class="player-name" id="player1-name">Nguyễn Quang Thắng</h2>
                    </div>
                    <div id="player1" class="hand" aria-label="Bài của Nguyễn Quang Thắng"></div>
                </section>

                <section class="player-panel" aria-labelledby="player2-name">
                    <div class="player-heading">
                        <span class="player-number" aria-hidden="true">02</span>
                        <h2 class="player-name" id="player2-name">Đỗ Đức Duy</h2>
                    </div>
                    <div id="player2" class="hand" aria-label="Bài của Đỗ Đức Duy"></div>
                </section>
            </div>

            <div id="card-desk" aria-hidden="true"></div>
            <div id="result" aria-live="polite"></div>
        </section>
    </main>

    <!-- <script src="main.js"></script> -->
    <script>
        let desk=document.getElementById("card-desk");
        let player1html=document.getElementById("player1");

        let cards=[];
        let values=['A','2','3','4','5','6','7','8','9'];

        let player1= new Player("Nguyễn Quang Thắng");
        let player2=new Player("Đỗ Đức Duy");
        function createCards(){ 
            for(let i=0;i<values.length;i++){
                for (let j=0;j<suits.length;j++){
                    let card=new Card(values[i],suits[j]);
                    cards.push(card);
                }
            }
        }
        function showCards(){
            let str="";
            for(let i=0;i<cards.length;i++){
                str+=cards[i].getImages();
            }
            desk.innerHTML=str;
        }
        function tronbai(){
            for(let i=0;i<cards.length;i++){
                let indexrandom=Math.floor(Math.random()*cards.length)
                let tmp=cards[i];
                cards[i]=cards[indexrandom];
                cards[indexrandom]=tmp;

            }
        }
        function get3Cards(player){
            for(let i=0;i<3;i++){
                player.addCard(cards.pop())
                // player.push(card);
            }
        }

        //         sum+=player[i].getValue();
        //     }

        //     return sum=10;
        //     return sum%10;
        // }
        function checkwin(){
            let player1Score=player1.tongdiem();
            let player2Score=player2.tongdiem();
            let str=`player1: ${player1Score} <br>
                     player2: ${player2Score} <br>`
            if(player1Score> player2Score)
            str+= `player 1 win`
            else if(player1Score<player2Score)
            str+=`player 2 win`
        else str+=`Hòa`
        document.getElementById("result").innerHTML=str;
            
        }
        document.querySelectorAll(".hand").forEach(hand => {
            hand.addEventListener("click", event => {
                let card=event.target.closest(".playing-card");
                if(!card || !hand.contains(card)) return;
                let isRevealed=card.classList.toggle("is-revealed");
                card.setAttribute("aria-pressed", isRevealed);
            });
        });
        createCards();

</body>
</html>
